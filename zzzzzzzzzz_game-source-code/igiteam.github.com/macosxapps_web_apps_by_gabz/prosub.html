    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            background: #111;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 15px;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #ffb300;
        }

        .header p {
            margin: 0;
            color: #888;
            font-size: 11px;
        }

        .controls {
            padding: 15px;
            border-bottom: 1px solid #333;
        }

        .control-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        .btn {
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
        }

        .btn:hover {
            background: #333;
            border-color: #ffb300;
        }

        .btn-primary {
            background: #ffb300;
            color: #000;
            border-color: #ffb300;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: #ffc233;
        }

        .btn-success {
            background: #28a745;
            color: #fff;
            border-color: #28a745;
        }

        .file-inputs {
            display: none;
        }

        .subtitle-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .subtitle-item {
            background: #222;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .subtitle-item:hover {
            border-color: #ffb300;
        }

        .subtitle-item.active {
            border-color: #ffb300;
            background: rgba(255, 179, 0, 0.1);
        }

        .subtitle-time {
            font-size: 11px;
            color: #ffb300;
            margin-bottom: 4px;
            font-family: monospace;
        }

        .subtitle-content {
            font-size: 13px;
            line-height: 1.3;
        }

        .subtitle-actions {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }

        .btn-sm {
            padding: 3px 6px;
            font-size: 11px;
            background: #333;
            border: 1px solid #444;
            min-width: 40px;
            flex: 1;
        }

        .btn-sm:hover {
            background: #444;
        }

        .add-at-time-btn {
            display: none;
            position: absolute;
            top: -10px;
            right: -10px;
            width: 24px;
            height: 24px;
            background: #ffb300;
            border: none;
            border-radius: 50%;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .subtitle-item:hover .add-at-time-btn {
            display: flex;
        }

        /* Main Content - FIXED */
        .main {
            display: flex;
            flex-direction: column;
            background: #000;
            height: 100vh;
            overflow: hidden;
        }

        .video-container {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
            min-height: 0;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Custom Subtitles Display */
        #custom-subtitles {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 24px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            max-width: 80%;
            display: none;
            z-index: 100;
            border-radius: 4px;
            pointer-events: none;
        }

        .video-controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 4px;
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .time-display {
            font-family: monospace;
            font-size: 12px;
            color: #fff;
            padding: 3px 6px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 3px;
        }

        /* Undo/Redo Status */
        .undo-status {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #888;
            z-index: 50;
            display: none;
        }

        /* Timeline Container */
        .timeline-container {
            background: #111;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            min-height: 150px;
            max-height: 400px;
            /* MAXIMUM HEIGHT LIMIT */
        }

        /* Resize Handle */
        .resize-handle {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            cursor: ns-resize;
            z-index: 1000;
            background: transparent;
            transition: background 0.2s;
        }

        .resize-handle:hover {
            background: rgba(255, 179, 0, 0.3);
        }

        .resize-handle::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: #666;
            border-radius: 1px;
        }

        .resize-handle:hover::before {
            background: #ffb300;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-bottom: 1px solid #333;
            min-height: 32px;
            flex-shrink: 0;
            margin-top: 8px;
        }

        .timeline-header h3 {
            margin: 0;
            font-size: 13px;
            color: #ccc;
        }

        .zoom-controls {
            display: flex;
            gap: 4px;
        }

        #timeline {
            flex: 1;
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            background: #000;
            min-height: 0;
            cursor: pointer;
        }

        .timeline-ruler {
            position: absolute;
            top: 0;
            left: 0;
            height: 22px;
            background: rgba(17, 17, 17, 0.95);
            border-bottom: 1px solid #333;
            display: flex;
            min-width: 100%;
            pointer-events: none;
        }

        .ruler-mark {
            position: relative;
            height: 100%;
            border-left: 1px solid #333;
            padding: 0 6px;
            display: flex;
            align-items: center;
            font-size: 10px;
            color: #888;
            min-width: 50px;
        }

        .block-container {
            position: absolute;
            top: 22px;
            left: 0;
            right: 0;
            bottom: 0;
            min-width: 100%;
            pointer-events: none;
        }

        /* Waveform Container */
        .waveform-container {
            position: absolute;
            top: 22px;
            left: 0;
            right: 0;
            height: 80px;
            min-width: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
            pointer-events: none;
        }

        #waveform-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Timeline Indicator */
        .timeline-indicator {
            position: absolute;
            top: 22px;
            left: 0;
            width: 2px;
            height: calc(100% - 22px);
            background: #ff5555;
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 0 5px rgba(255, 85, 85, 0.8);
        }

        .timeline-indicator::after {
            content: '';
            position: absolute;
            top: 0;
            left: -4px;
            width: 10px;
            height: 10px;
            background: #ff5555;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 85, 85, 0.9);
        }

        /* Ghost Indicator */
        .ghost-indicator {
            position: absolute;
            top: 22px;
            left: 0;
            width: 2px;
            height: calc(100% - 22px);
            background: rgba(255, 255, 255, 0.6);
            z-index: 49;
            pointer-events: none;
            display: none;
        }

        .ghost-indicator::after {
            content: '';
            position: absolute;
            top: 0;
            left: -3px;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.6);
        }

        .block {
            position: absolute;
            height: 32px;
            background: #ffb300;
            border-radius: 4px;
            cursor: grab;
            padding: 5px;
            font-size: 11px;
            color: #000;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            border: 2px solid transparent;
            transition: all 0.2s;
            user-select: none;
            z-index: 2;
            pointer-events: auto;
            top: 90px;
        }

        .block:hover {
            border-color: white;
        }

        .block.resizing {
            cursor: ew-resize;
        }

        .block-handle {
            position: absolute;
            width: 6px;
            height: 100%;
            top: 0;
            cursor: ew-resize;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .block:hover .block-handle {
            opacity: 1;
        }

        .handle-left {
            left: 0;
        }

        .handle-right {
            right: 0;
        }

        .block-time {
            position: absolute;
            bottom: -16px;
            left: 0;
            font-size: 9px;
            color: #888;
            white-space: nowrap;
        }

        /* Waveform Loading */
        .waveform-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font-size: 12px;
            display: none;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #222;
            border: 1px solid #444;
            border-radius: 4px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 15px;
            border-bottom: 1px solid #333;
            background: #1a1a1a;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 16px;
            color: #ffb300;
        }

        .modal-body {
            padding: 15px;
        }

        .export-format {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .format-btn {
            padding: 12px;
            background: #333;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .format-btn:hover {
            border-color: #ffb300;
        }

        .format-btn.active {
            border-color: #ffb300;
            background: rgba(255, 179, 0, 0.1);
        }

        .export-preview {
            background: #000;
            border-radius: 4px;
            padding: 12px;
            font-family: monospace;
            font-size: 11px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 12px;
            color: #ccc;
        }

        .modal-controls {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        /* Editor */
        .editor-panel {
            display: none;
            position: absolute;
            top: 15px;
            right: 15px;
            width: 280px;
            background: #222;
            border: 1px solid #444;
            border-radius: 4px;
            z-index: 100;
        }

        .editor-panel.active {
            display: block;
        }

        .editor-header {
            padding: 12px;
            border-bottom: 1px solid #333;
            background: #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-header h3 {
            margin: 0;
            font-size: 14px;
            color: #ffb300;
        }

        .close-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #fff;
        }

        .editor-body {
            padding: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            color: #888;
        }

        .time-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .time-input {
            flex: 1;
            padding: 6px;
            background: #000;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            font-family: monospace;
            font-size: 12px;
        }

        textarea {
            width: 100%;
            min-height: 80px;
            padding: 8px;
            background: #000;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            resize: vertical;
        }

        .editor-controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        /* Export filename input */
        #exportFileName {
            width: 100%;
            padding: 8px;
            background: #000;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            margin-bottom: 5px;
        }

        #exportFileName:focus {
            border-color: #ffb300;
            outline: none;
        }

        #fileNamePreview {
            color: #ffb300;
            font-weight: bold;
        }

        /* Fullscreen subtitles */
        #fullscreen-subtitles {
            display: none;
        }

        /* Utility */
        .hidden {
            display: none;
        }

        /* Fullscreen handling */
        .video-container:-webkit-full-screen {
            width: 100%;
            height: 100%;
        }

        .video-container:-moz-full-screen {
            width: 100%;
            height: 100%;
        }

        .video-container:-ms-fullscreen {
            width: 100%;
            height: 100%;
        }

        .video-container:fullscreen {
            width: 100%;
            height: 100%;
        }

        video:-webkit-full-screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        video:-moz-full-screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        video:-ms-fullscreen {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        video:fullscreen {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>

    <script>
        const video = document.getElementById('video');
        const timeline = document.getElementById('timeline');
        const blockContainer = document.getElementById('blockContainer');
        const timelineRuler = document.getElementById('timelineRuler');
        const timelineIndicator = document.getElementById('timelineIndicator');
        const ghostIndicator = document.getElementById('ghostIndicator');
        const subtitleList = document.getElementById('subtitleList');
        const editorPanel = document.getElementById('editorPanel');
        const exportModal = document.getElementById('exportModal');
        const customSubtitles = document.getElementById('custom-subtitles');
        const waveformCanvas = document.getElementById('waveform-canvas');
        const waveformLoading = document.getElementById('waveformLoading');
        const timelineContainer = document.getElementById('timelineContainer');
        const timelineResizeHandle = document.getElementById('timelineResizeHandle');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const undoStatus = document.getElementById('undoStatus');
        const ctx = waveformCanvas.getContext('2d');

        let subtitles = [];
        let duration = 0;
        let timelineZoom = 1;
        let selectedFormat = 'srt';
        let editingId = null;
        let lastActiveSubtitleId = -1;
        let audioContext = null;
        let audioBuffer = null;
        let waveformData = [];
        let isDraggingIndicator = false;
        let isResizingTimeline = false;

        // UNDO/REDO STACK
        let undoStack = [];
        let redoStack = [];
        const MAX_HISTORY = 100;

        // Initialize
        init();

        function init() {
            updateVideoTime();
            renderRuler();
            renderSubtitles();
            setupEventListeners();
            setupVideoSubtitles();
            setupTimelineInteractions();
            setupTimelineResize();
            // Save initial state
            saveState('Initial State');
        }

        function setupEventListeners() {
            // Add keyboard event listeners
            document.addEventListener('keydown', jumpToStartOnEnter);
            document.addEventListener('keydown', togglePlayPauseOnSpace);
            document.addEventListener('keydown', handleUndoRedo);

            video.addEventListener('loadedmetadata', () => {
                duration = video.duration;
                document.getElementById('duration').textContent = formatTime(duration);
                renderRuler();
                renderSubtitles();
                updateVideoSubtitles();
                extractAudioAndDrawWaveform();
                // Save state after video loads
                saveState('Video Loaded');
            });

            video.addEventListener('timeupdate', updateVideoTime);
            video.addEventListener('timeupdate', updateActiveSubtitle);
            video.addEventListener('timeupdate', scrollToActiveSubtitle);
            video.addEventListener('timeupdate', updateTimelineIndicator);
            video.addEventListener('fullscreenchange', updateSubtitlePosition);
            video.addEventListener('webkitfullscreenchange', updateSubtitlePosition);
            video.addEventListener('mozfullscreenchange', updateSubtitlePosition);
            video.addEventListener('MSFullscreenChange', updateSubtitlePosition);

            // Handle video file selection
            document.getElementById('videoInput').addEventListener('change', function (e) {
                const file = e.target.files[0];
                if (file) {
                    video.src = URL.createObjectURL(file);
                    video.load();
                    // Clear any existing text tracks properly
                    const tracks = video.querySelectorAll('track');
                    tracks.forEach(track => {
                        if (track.parentNode === video) {
                            video.removeChild(track);
                        }
                    });
                    subtitles = []; // Clear subtitles when loading new video
                    renderSubtitles();
                    // Reset waveform
                    waveformData = [];
                    drawWaveform();
                    // Clear history when loading new video
                    undoStack = [];
                    redoStack = [];
                    updateUndoRedoButtons();
                    saveState('New Video Loaded');
                }
            });

            // Handle subtitle file selection
            document.getElementById('subInput').addEventListener('change', function (e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        parseSubs(e.target.result);
                        updateVideoSubtitles();
                        saveState('Subtitles Loaded');
                    };
                    reader.readAsText(file);
                }
            });

            // Add filename input change listener
            document.getElementById('exportFileName').addEventListener('input', updateFileNamePreview);

            // Window resize listener for waveform
            window.addEventListener('resize', () => {
                if (waveformData.length > 0) {
                    redrawWaveform();
                }
            });
        }

        function handleUndoRedo(event) {
            const isTyping = event.target.tagName === 'INPUT' ||
                event.target.tagName === 'TEXTAREA' ||
                event.target.isContentEditable;

            if (isTyping) return;

            // Check for Cmd/Ctrl + Z (Undo)
            if ((event.metaKey || event.ctrlKey) && event.key === 'z' && !event.shiftKey) {
                event.preventDefault();
                undo();
            }
            // Check for Cmd/Ctrl + Shift + Z (Redo)
            else if ((event.metaKey || event.ctrlKey) && event.shiftKey && event.key === 'z') {
                event.preventDefault();
                redo();
            }
            // Check for Cmd/Ctrl + Y (Redo alternative)
            else if ((event.metaKey || event.ctrlKey) && event.key === 'y') {
                event.preventDefault();
                redo();
            }
        }

        function saveState(description = 'Edit') {
            // Deep copy of current subtitles
            const state = JSON.parse(JSON.stringify(subtitles));

            // Add to undo stack
            undoStack.push({
                subtitles: state,
                description: description,
                timestamp: new Date().toLocaleTimeString()
            });

            // Limit stack size
            if (undoStack.length > MAX_HISTORY) {
                undoStack.shift();
            }

            // Clear redo stack when new action is performed
            redoStack = [];

            // Update UI
            updateUndoRedoButtons();

            // Show status
            showUndoStatus(`Saved: ${description}`);
        }

        function undo() {
            if (undoStack.length <= 1) return; // Keep at least initial state

            // Move current state to redo stack
            const currentState = undoStack.pop();
            redoStack.push(currentState);

            // Get previous state
            const previousState = undoStack[undoStack.length - 1];

            // Restore state
            subtitles = JSON.parse(JSON.stringify(previousState.subtitles));

            // Update UI
            renderSubtitles();
            updateVideoSubtitles();
            updateUndoRedoButtons();

            // Show status
            showUndoStatus(`Undo: ${currentState.description}`);
        }

        function redo() {
            if (redoStack.length === 0) return;

            // Get next state
            const nextState = redoStack.pop();

            // Add to undo stack
            undoStack.push(nextState);

            // Restore state
            subtitles = JSON.parse(JSON.stringify(nextState.subtitles));

            // Update UI
            renderSubtitles();
            updateVideoSubtitles();
            updateUndoRedoButtons();

            // Show status
            showUndoStatus(`Redo: ${nextState.description}`);
        }

        function updateUndoRedoButtons() {
            // Enable/disable buttons based on stack state
            undoBtn.disabled = undoStack.length <= 1;
            redoBtn.disabled = redoStack.length === 0;

            // Update button titles
            undoBtn.title = `Undo (${undoStack.length - 1} steps available)`;
            redoBtn.title = `Redo (${redoStack.length} steps available)`;
        }

        function showUndoStatus(message) {
            undoStatus.textContent = message;
            undoStatus.style.display = 'block';
            undoStatus.style.opacity = '1';

            // Hide after delay
            setTimeout(() => {
                undoStatus.style.opacity = '0';
                setTimeout(() => {
                    undoStatus.style.display = 'none';
                }, 300);
            }, 1500);
        }

        function setupTimelineResize() {
            let startY, startHeight;

            timelineResizeHandle.addEventListener('mousedown', function (e) {
                e.preventDefault();
                e.stopPropagation();

                isResizingTimeline = true;
                startY = e.clientY;
                startHeight = timelineContainer.offsetHeight;

                document.body.style.cursor = 'ns-resize';
                document.body.style.userSelect = 'none';

                function onMouseMove(e) {
                    if (!isResizingTimeline) return;

                    const deltaY = startY - e.clientY;
                    const newHeight = Math.max(150, Math.min(400, startHeight + deltaY)); // Min:150px, Max:400px

                    timelineContainer.style.height = newHeight + 'px';

                    // Redraw waveform to fit new height
                    if (waveformData.length > 0) {
                        redrawWaveform();
                    }
                }

                function onMouseUp() {
                    isResizingTimeline = false;
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';

                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            // Prevent text selection while resizing
            timelineResizeHandle.addEventListener('selectstart', function (e) {
                e.preventDefault();
                return false;
            });
        }

        function getTimeFromMouseEvent(e) {
            const timelineRect = timeline.getBoundingClientRect();
            const scrollLeft = timeline.scrollLeft;

            // Calculate relative position
            const relativeX = e.clientX - timelineRect.left + scrollLeft;
            const totalWidth = blockContainer.scrollWidth;

            // Calculate percentage
            const percent = (relativeX / totalWidth) * 100;

            // Convert to time
            const time = (percent / 100) * duration;

            return Math.max(0, Math.min(duration, time));
        }

        function setupTimelineInteractions() {
            // Click on timeline to jump to time
            timeline.addEventListener('click', (e) => {
                if (isDraggingIndicator || isResizingTimeline) return;

                const time = getTimeFromMouseEvent(e);
                video.currentTime = time;
            });

            // Mouse move to show ghost indicator
            timeline.addEventListener('mousemove', (e) => {
                if (isResizingTimeline) return;

                const timelineRect = timeline.getBoundingClientRect();
                if (e.clientX >= timelineRect.left && e.clientX <= timelineRect.right &&
                    e.clientY >= timelineRect.top && e.clientY <= timelineRect.bottom) {

                    const scrollLeft = timeline.scrollLeft;
                    const relativeX = e.clientX - timelineRect.left + scrollLeft;
                    const percent = (relativeX / blockContainer.scrollWidth) * 100;

                    ghostIndicator.style.left = `${percent}%`;
                    ghostIndicator.style.display = 'block';
                } else {
                    ghostIndicator.style.display = 'none';
                }
            });

            timeline.addEventListener('mouseleave', () => {
                ghostIndicator.style.display = 'none';
            });

            // Drag indicator
            timelineIndicator.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                isDraggingIndicator = true;
                document.body.style.cursor = 'grabbing';
                ghostIndicator.style.display = 'none';

                const onMouseMove = (ev) => {
                    const time = getTimeFromMouseEvent(ev);
                    video.currentTime = time;
                };

                const onMouseUp = () => {
                    isDraggingIndicator = false;
                    document.body.style.cursor = '';
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    setTimeout(() => {
                        ghostIndicator.style.display = 'block';
                    }, 100);
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }

        function updateTimelineIndicator() {
            if (duration > 0) {
                const percent = (video.currentTime / duration) * 100;
                timelineIndicator.style.left = `${percent}%`;
            }
        }

        async function extractAudioAndDrawWaveform() {
            if (!video.src) return;

            waveformLoading.style.display = 'block';

            try {
                // Create audio context
                audioContext = new (window.AudioContext || window.webkitAudioContext)();

                // Fetch the video file
                const response = await fetch(video.src);
                const arrayBuffer = await response.arrayBuffer();

                // Decode audio data
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

                // Process audio data for waveform
                processAudioData();
                redrawWaveform();
            } catch (error) {
                console.error('Error extracting audio:', error);
                // Draw a simple waveform placeholder if audio extraction fails
                generateDummyWaveform();
                redrawWaveform();
            } finally {
                waveformLoading.style.display = 'none';
            }
        }

        function processAudioData() {
            if (!audioBuffer) return;

            const data = audioBuffer.getChannelData(0); // Get first channel
            const samples = 1000; // Number of waveform samples
            const blockSize = Math.floor(data.length / samples);
            waveformData = [];

            for (let i = 0; i < samples; i++) {
                let sum = 0;
                for (let j = 0; j < blockSize; j++) {
                    sum += Math.abs(data[i * blockSize + j]);
                }
                waveformData.push(sum / blockSize);
            }

            // Normalize waveform data
            const max = Math.max(...waveformData);
            if (max > 0) {
                waveformData = waveformData.map(value => value / max);
            }
        }

        function generateDummyWaveform() {
            const samples = 1000;
            waveformData = [];

            for (let i = 0; i < samples; i++) {
                const value = Math.sin(i * 0.05) * 0.3 +
                    Math.sin(i * 0.1) * 0.2 +
                    Math.sin(i * 0.3) * 0.1;
                waveformData.push(Math.max(0, value * 0.5 + 0.3 + Math.random() * 0.05));
            }
        }

        function redrawWaveform() {
            if (!waveformData.length) return;

            const width = timeline.offsetWidth;
            const height = 80; // Fixed waveform height

            waveformCanvas.width = width;
            waveformCanvas.height = height;

            ctx.clearRect(0, 0, width, height);

            // Draw background
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);

            // Draw waveform based on zoom
            const visibleDuration = duration / timelineZoom;
            const totalWidth = timeline.scrollWidth;
            const visibleWidth = width;

            const startPercent = timeline.scrollLeft / totalWidth;
            const endPercent = (timeline.scrollLeft + visibleWidth) / totalWidth;

            const startSample = Math.floor(startPercent * waveformData.length);
            const endSample = Math.floor(endPercent * waveformData.length);
            const samplesToDraw = Math.max(1, endSample - startSample);

            if (samplesToDraw === 0) return;

            const barWidth = Math.max(1, width / samplesToDraw);
            const centerY = height / 2;

            for (let i = 0; i < samplesToDraw; i++) {
                const sampleIndex = startSample + i;
                if (sampleIndex >= waveformData.length) break;

                const value = waveformData[sampleIndex];
                const barHeight = value * height * 0.8;
                const x = i * barWidth;
                const y = centerY - barHeight / 2;

                const gradient = ctx.createLinearGradient(x, y, x, y + barHeight);
                gradient.addColorStop(0, '#ffb300');
                gradient.addColorStop(0.5, '#ff8800');
                gradient.addColorStop(1, '#ff5500');

                ctx.fillStyle = gradient;
                ctx.fillRect(x, y, Math.max(1, barWidth * 0.8), barHeight);
            }
        }

        function drawWaveform() {
            if (!waveformData.length) return;

            const width = timeline.offsetWidth;
            const height = 80;

            waveformCanvas.width = width;
            waveformCanvas.height = height;

            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);

            const barWidth = width / waveformData.length;
            const centerY = height / 2;

            for (let i = 0; i < waveformData.length; i++) {
                const value = waveformData[i];
                const barHeight = value * height * 0.8;
                const x = i * barWidth;
                const y = centerY - barHeight / 2;

                const gradient = ctx.createLinearGradient(x, y, x, y + barHeight);
                gradient.addColorStop(0, '#ffb300');
                gradient.addColorStop(0.5, '#ff8800');
                gradient.addColorStop(1, '#ff5500');

                ctx.fillStyle = gradient;
                ctx.fillRect(x, y, Math.max(1, barWidth * 0.8), barHeight);
            }
        }

        function setupVideoSubtitles() {
            // Check if track already exists
            if (!video.querySelector('track')) {
                // Create a text track for the video
                const track = document.createElement('track');
                track.kind = 'subtitles';
                track.label = 'English';
                track.srclang = 'en';
                track.default = true;
                video.appendChild(track);
            }

            // Handle fullscreen changes
            video.addEventListener('fullscreenchange', updateSubtitlePosition);
            video.addEventListener('webkitfullscreenchange', updateSubtitlePosition);
            video.addEventListener('mozfullscreenchange', updateSubtitlePosition);
            video.addEventListener('MSFullscreenChange', updateSubtitlePosition);

            document.addEventListener('fullscreenchange', updateSubtitlePosition);
            document.addEventListener('webkitfullscreenchange', updateSubtitlePosition);
            document.addEventListener('mozfullscreenchange', updateSubtitlePosition);
            document.addEventListener('MSFullscreenChange', updateSubtitlePosition);
        }

        function updateVideoSubtitles() {
            const track = video.querySelector('track');
            if (!track) return;

            // Clear existing cues properly
            if (track.cues) {
                while (track.cues.length > 0) {
                    track.removeCue(track.cues[0]);
                }
            }

            // Add cues from subtitles
            subtitles.forEach((sub, index) => {
                const cue = new VTTCue(sub.start, sub.end, sub.content);
                cue.id = `cue-${index}`;
                track.addCue(cue);
            });

            track.mode = 'hidden'; // Hide native captions, keep cues accessible

            // Handle cue changes to show custom subtitles
            track.addEventListener('cuechange', function () {
                const activeCues = this.activeCues;

                if (activeCues.length > 0) {
                    // Show active cue
                    customSubtitles.textContent = activeCues[0].text;
                    customSubtitles.style.display = 'block';
                } else {
                    // Hide when no active cues
                    customSubtitles.style.display = 'none';
                }
            });
        }

        function updateActiveSubtitle() {
            const currentTime = video.currentTime;
            const activeSubtitle = subtitles.find(s => currentTime >= s.start && currentTime <= s.end);

            if (activeSubtitle) {
                customSubtitles.textContent = activeSubtitle.content;
                customSubtitles.style.display = 'block';

                // Update fullscreen subtitles if they exist
                const fullscreenSubs = document.getElementById('fullscreen-subtitles');
                if (fullscreenSubs) {
                    fullscreenSubs.textContent = activeSubtitle.content;
                    fullscreenSubs.style.display = 'block';
                }
            } else {
                customSubtitles.style.display = 'none';

                // Hide fullscreen subtitles if they exist
                const fullscreenSubs = document.getElementById('fullscreen-subtitles');
                if (fullscreenSubs) {
                    fullscreenSubs.style.display = 'none';
                }
            }
        }

        function updateSubtitlePosition() {
            // Check if video is in fullscreen mode
            const isFullscreen = document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement;

            if (isFullscreen && isFullscreen === video) {

                    `;

        function scrollToActiveSubtitle() {
            const currentTime = video.currentTime;
            const activeIndex = subtitles.findIndex(s => currentTime >= s.start && currentTime <= s.end);

            if (activeIndex !== -1 && activeIndex !== lastActiveSubtitleId) {
                lastActiveSubtitleId = activeIndex;

                // Find the subtitle item element
                const subtitleItems = document.querySelectorAll('.subtitle-item');
                if (subtitleItems[activeIndex]) {
                    // Scroll the subtitle into view
                    subtitleItems[activeIndex].scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    });
                }
            }
        }

        function parseSubs(text) {
            subtitles = [];
            const lines = text.split('\n');
            let id = 0;

            if (text.includes('WEBVTT') || text.includes('-->')) {
                // Parse WebVTT/SRT
                let currentSub = null;

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();

                    if (line.includes('-->')) {
                        if (currentSub) {
                            subtitles.push(currentSub);
                            id++;
                        }

                        const times = line.split('-->').map(t => t.trim());
                        currentSub = {
                            id: id,
                            start: toSeconds(times[0]),
                            end: toSeconds(times[1]),
                            content: ''
                        };
                    } else if (currentSub && line && !line.match(/^\d+$/) && !line.includes('WEBVTT')) {
                        if (currentSub.content) {
                            currentSub.content += '\n' + line;
                        } else {
                            currentSub.content = line;
                        }
                    }
                }

                if (currentSub) {
                    subtitles.push(currentSub);
                }
            }

            renderSubtitles();
            updateVideoSubtitles();
        }

        function toSeconds(timeStr) {
            timeStr = timeStr.replace(',', '.').trim();
            const parts = timeStr.split(':');
            if (parts.length === 3) {
                return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseFloat(parts[2]);
            }
            return parseFloat(timeStr);
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00:00.000';

            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = (seconds % 60).toFixed(3);
            return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.padStart(6, '0')}`;
        }

        function updateVideoTime() {
            document.getElementById('currentTime').textContent = formatTime(video.currentTime);

            // Highlight current subtitle in sidebar
            const currentId = subtitles.findIndex(s =>
                video.currentTime >= s.start && video.currentTime <= s.end
            );

            document.querySelectorAll('.subtitle-item').forEach((item, index) => {
                item.classList.toggle('active', index === currentId);
            });
        }

        function renderRuler() {
            timelineRuler.innerHTML = '';
            const totalMarks = Math.ceil(duration / 5); // One mark every 5 seconds

            for (let i = 0; i <= totalMarks; i++) {
                const time = i * 5;
                const mark = document.createElement('div');
                mark.className = 'ruler-mark';
                mark.style.left = `${(time / duration) * 100 * timelineZoom}%`;
                mark.textContent = formatTime(time);
                timelineRuler.appendChild(mark);
            }
        }

        function renderSubtitles() {
            // Clear existing
            subtitleList.innerHTML = '';
            blockContainer.innerHTML = '';

            // Sort by start time
            subtitles.sort((a, b) => a.start - b.start);

            // Track occupied positions for each time segment
            const occupiedRows = new Map();

            // First pass: determine positions without overlapping
            subtitles.forEach((sub, index) => {
                // Try to find the lowest available row (1-3)
                let rowFound = -1;

                for (let row = 0; row < 3; row++) {
                    let canPlace = true;

                    // Check if this row is occupied at this time segment
                    const rowOccupations = occupiedRows.get(row) || [];
                    for (const occupied of rowOccupations) {
                        // Check for overlap
                        if ((sub.start < occupied.end && sub.end > occupied.start)) {
                            canPlace = false;
                            break;
                        }
                    }

                    if (canPlace) {
                        rowFound = row;
                        // Mark this time segment as occupied
                        if (!occupiedRows.has(row)) {
                            occupiedRows.set(row, []);
                        }
                        occupiedRows.get(row).push({ start: sub.start, end: sub.end });
                        break;
                    }
                }

                // If no row found (shouldn't happen with only 3 rows), use row 0
                const rowIndex = rowFound === -1 ? 0 : rowFound;

                // Sidebar list item
                const listItem = document.createElement('div');
                listItem.className = 'subtitle-item';
                listItem.onclick = () => editSubtitle(sub.id);

                listItem.innerHTML = `
                    <div class="subtitle-time">${formatTime(sub.start)} --> ${formatTime(sub.end)}</div>
                    <div class="subtitle-content">${sub.content}</div>
                    <div class="subtitle-actions">
                        <button class="btn btn-sm" onclick="event.stopPropagation(); deleteSubtitle(${sub.id})">🗑️ Delete</button>
                        <button class="btn btn-sm" onclick="event.stopPropagation(); jumpToTime(${sub.start})">▶️ Jump</button>
                    </div>
                    <button class="add-at-time-btn" onclick="event.stopPropagation(); addSubtitleAfter(${sub.id})">+</button>
                `;
                subtitleList.appendChild(listItem);

                // Timeline block
                const block = document.createElement('div');
                block.className = 'block';
                block.dataset.id = sub.id;
                block.textContent = sub.content.length > 30 ? sub.content.substring(0, 30) + '...' : sub.content;

                const leftPercent = (sub.start / duration) * 100 * timelineZoom;
                const widthPercent = Math.max(0.5, ((sub.end - sub.start) / duration) * 100 * timelineZoom);

                block.style.left = `${leftPercent}%`;
                block.style.width = `${widthPercent}%`;

                // Calculate block position based on available height
                const timelineHeight = timelineContainer.offsetHeight;
                const maxTop = timelineHeight - 60; // Maximum top position (leaves room for time display)
                const rowHeight = Math.min(36, (maxTop - 90) / 3); // Dynamic row height

                // Use the calculated row index (0, 1, or 2)
                const blockTop = 90 + (rowIndex * rowHeight);
                block.style.top = `${Math.min(blockTop, maxTop)}px`;

                // Add resize handles
                const leftHandle = document.createElement('div');
                leftHandle.className = 'block-handle handle-left';
                const rightHandle = document.createElement('div');
                rightHandle.className = 'block-handle handle-right';

                block.appendChild(leftHandle);
                block.appendChild(rightHandle);

                // Add time display
                const timeDisplay = document.createElement('div');
                timeDisplay.className = 'block-time';
                timeDisplay.textContent = formatTime(sub.start);
                block.appendChild(timeDisplay);

                setupBlockInteractions(block, sub);
                blockContainer.appendChild(block);
            });

            // If no subtitles, show a message
            if (subtitles.length === 0) {
                subtitleList.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: #888;">
                        No subtitles yet. Click "Add at Current Time" to add your first subtitle.
                    </div>
                `;
            }
        }

        function setupBlockInteractions(block, sub) {
            let isDragging = false;
            let isResizing = false;
            let resizeSide = null;
            let startX, startStart, startEnd;
            let hasChanged = false;

            block.onmousedown = (e) => {
                e.preventDefault();

                if (e.target.classList.contains('block-handle')) {
                    isResizing = true;
                    resizeSide = e.target.classList.contains('handle-left') ? 'left' : 'right';
                    block.classList.add('resizing');
                } else {
                    isDragging = true;
                    block.style.cursor = 'grabbing';
                }

                startX = e.clientX;
                startStart = sub.start;
                startEnd = sub.end;
                hasChanged = false;

                const onMouseMove = (ev) => {
                    ev.preventDefault();
                    const dx = ev.clientX - startX;
                    const timeDelta = (dx / timeline.offsetWidth) * duration / timelineZoom;

                    if (isResizing) {
                        if (resizeSide === 'left') {
                            sub.start = Math.max(0, Math.min(startStart + timeDelta, sub.end - 0.1));
                        } else {
                            sub.end = Math.min(duration, Math.max(startEnd + timeDelta, sub.start + 0.1));
                        }
                    } else if (isDragging) {
                        sub.start = Math.max(0, Math.min(startStart + timeDelta, duration - (startEnd - startStart)));
                        sub.end = sub.start + (startEnd - startStart);
                    }

                    renderSubtitles();
                    updateVideoSubtitles();
                    hasChanged = true;
                };

                const onMouseUp = () => {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    isDragging = false;
                    isResizing = false;
                    resizeSide = null;
                    block.classList.remove('resizing');
                    block.style.cursor = 'grab';

                    if (hasChanged) {
                        saveState('Move/Resize Subtitle');
                    }

                    renderSubtitles();
                    updateVideoSubtitles();
                };

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            };

            block.ondblclick = (e) => {
                e.preventDefault();
                editSubtitle(sub.id);
            };
        }

        function addSubtitleAtCurrentTime() {
            const newId = subtitles.length > 0 ? Math.max(...subtitles.map(s => s.id)) + 1 : 0;
            const currentTime = video.currentTime;
            const startTime = Math.max(0, currentTime);
            const endTime = Math.min(duration, currentTime + 3); // Default 3 second duration

            const newSub = {
                id: newId,
                start: startTime,
                end: endTime,
                content: 'New subtitle'
            };

            subtitles.push(newSub);
            subtitles.sort((a, b) => a.start - b.start);
            renderSubtitles();
            updateVideoSubtitles();
            saveState('Add Subtitle');
            editSubtitle(newId);
        }

        function addSubtitleAfter(subId) {
            const subIndex = subtitles.findIndex(s => s.id === subId);
            if (subIndex === -1) return;

            const sub = subtitles[subIndex];
            const newId = Math.max(...subtitles.map(s => s.id)) + 1;

            // Add new subtitle starting at the end of the current one
            const startTime = sub.end;
            const endTime = Math.min(duration, startTime + 3); // Default 3 second duration

            const newSub = {
                id: newId,
                start: startTime,
                end: endTime,
                content: 'New subtitle'
            };

            subtitles.push(newSub);
            subtitles.sort((a, b) => a.start - b.start);
            renderSubtitles();
            updateVideoSubtitles();
            saveState('Add Subtitle After');
            editSubtitle(newId);
        }

        function editSubtitle(id) {
            const sub = subtitles.find(s => s.id === id);
            if (!sub) return;

            editingId = id;
            document.getElementById('editStart').value = formatTime(sub.start);
            document.getElementById('editEnd').value = formatTime(sub.end);
            document.getElementById('editText').value = sub.content;

            editorPanel.classList.add('active');
        }

        function saveEdit() {
            if (editingId === null) return;

            const sub = subtitles.find(s => s.id === editingId);
            if (sub) {
                sub.start = toSeconds(document.getElementById('editStart').value);
                sub.end = toSeconds(document.getElementById('editEnd').value);
                sub.content = document.getElementById('editText').value;
            }

            closeEditor();
            subtitles.sort((a, b) => a.start - b.start);
            renderSubtitles();
            updateVideoSubtitles();
            saveState('Edit Subtitle');
        }

        function closeEditor() {
            editorPanel.classList.remove('active');
            editingId = null;
        }

        function deleteSubtitle(id) {
            if (confirm('Delete this subtitle?')) {
                subtitles = subtitles.filter(s => s.id !== id);
                renderSubtitles();
                updateVideoSubtitles();
                closeEditor();
                saveState('Delete Subtitle');
            }
        }

        function jumpToTime(time) {
            video.currentTime = time;
        }

        function zoomTimeline(factor) {
            timelineZoom *= factor;
            timelineZoom = Math.max(0.5, Math.min(timelineZoom, 3));
            renderSubtitles();
            renderRuler();
            // Redraw waveform with zoom
            if (waveformData.length > 0) {
                redrawWaveform();
            }
            saveState('Zoom Timeline');
        }

        function openExportModal() {
            selectedFormat = 'srt';
            updateExportPreview();
            updateFileNamePreview();
            exportModal.classList.add('active');
            // Focus the filename input
            setTimeout(() => {
                document.getElementById('exportFileName').focus();
                document.getElementById('exportFileName').select();
            }, 100);
        }

        function closeExportModal() {
            exportModal.classList.remove('active');
        }

        function selectFormat(format) {
            selectedFormat = format;
            document.querySelectorAll('.format-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.format === format);
            });
            updateExportPreview();
            updateFileNamePreview();
        }

        function updateFileNamePreview() {
            const fileName = document.getElementById('exportFileName').value.trim() || 'subtitles';
            document.getElementById('fileNamePreview').textContent = `${fileName}.${selectedFormat}`;
        }

        function updateExportPreview() {
            let output = '';

            if (selectedFormat === 'srt') {
                subtitles.forEach((sub, index) => {
                    output += `${index + 1}\n`;
                    output += `${formatTime(sub.start).replace('.', ',')} --> ${formatTime(sub.end).replace('.', ',')}\n`;
                    output += `${sub.content}\n\n`;
                });
            } else if (selectedFormat === 'vtt') {
                output = 'WEBVTT\n\n';
                subtitles.forEach((sub, index) => {
                    output += `${index + 1}\n`;
                    output += `${formatTime(sub.start)} --> ${formatTime(sub.end)}\n`;
                    output += `${sub.content}\n\n`;
                });
            }

            document.getElementById('exportContent').value = output;
        }

        function copyToClipboard() {
            const content = document.getElementById('exportContent');
            content.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        }

        function downloadFile() {
            const content = document.getElementById('exportContent').value;
            const fileNameInput = document.getElementById('exportFileName');
            let fileName = fileNameInput.value.trim();

            // Use default name if empty
            if (!fileName) {
                fileName = 'subtitles';
            }

            // Remove any existing extension
            fileName = fileName.replace(/\.[^/.]+$/, "");

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${fileName}.${selectedFormat}`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 1. Function to set video to 0 time when Enter key is pressed
        function jumpToStartOnEnter(event) {
            const isTyping = event.target.tagName === 'INPUT' ||
                event.target.tagName === 'TEXTAREA' ||
                event.target.isContentEditable;

            if (isTyping) return;

            if (event.key === 'Enter') {
                event.preventDefault();
                video.currentTime = 0;
                video.pause();
            }
        }

        // 2. Function to toggle play/pause when Spacebar is pressed
        function togglePlayPauseOnSpace(event) {
            const isTyping = event.target.tagName === 'INPUT' ||
                event.target.tagName === 'TEXTAREA' ||
                event.target.isContentEditable;

            if (isTyping) return;

            if (event.key === ' ' || event.key === 'Spacebar') {
                event.preventDefault();
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            }
        }
    </script>
</body>

</html>
